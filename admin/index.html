<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Curino</title>
<link rel="icon" type="image/png" href="/assets/imagenes/logo-solo-curino.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/catalog-helpers.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--ink:#1a1a1a;--ink-soft:#555;--mid:#888;--border:#e5e5e5;--white:#fff;--bg:#fafaf7;--coral:#cc785c;--font:'Open Sans',system-ui,sans-serif}
body{font-family:var(--font);color:var(--black);background:var(--bg);min-height:100vh}
/* Hide entire page until the admin role check completes — without this,
   non-admin users briefly see the header / tabs / "Cargando…" placeholder
   before the access-denied alert and redirect fire (the role check is
   async; the DOM is ready first). visibility:hidden keeps layout stable
   so revealing later doesn't reflow. */
body.hidden-until-auth{visibility:hidden}
.admin-header{background:#111;color:#fff;padding:.85rem 1.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.admin-header h1{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.admin-header h1 span{opacity:.55;margin-left:.4rem;font-weight:300}
.admin-header nav{display:flex;gap:.5rem;align-items:center}
.admin-header a{color:#bbb;font-size:12px;text-decoration:none;padding:.4rem .7rem;border-radius:4px;transition:background .15s,color .15s}
.admin-header a:hover{color:#fff;background:rgba(255,255,255,.1)}
.admin-header button{background:transparent;color:#bbb;border:1px solid #444;font-size:11px;padding:.35rem .7rem;border-radius:4px;cursor:pointer;font-family:var(--font);letter-spacing:.05em;text-transform:uppercase}
.admin-header button:hover{color:#fff;border-color:#666}
.admin-tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;padding:0 1.5rem;position:sticky;top:53px;z-index:9}
.admin-tab{padding:.85rem 1.2rem;font-size:13px;font-weight:600;color:var(--mid);border:none;background:transparent;cursor:pointer;font-family:var(--font);border-bottom:2px solid transparent;letter-spacing:.04em}
.admin-tab.active{color:var(--ink);border-bottom-color:var(--coral)}
.admin-pane{display:none;padding:1.5rem;max-width:1280px;margin:0 auto}
.admin-pane.active{display:block}
.admin-toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem}
.admin-toolbar select,.admin-toolbar input[type=text]{padding:.45rem .6rem;font-size:13px;border:1px solid var(--border);border-radius:4px;background:#fff;font-family:var(--font);color:var(--ink)}
.admin-toolbar label{display:inline-flex;align-items:center;gap:.4rem;font-size:13px;color:var(--ink-soft);cursor:pointer}
.admin-btn{padding:.5rem .85rem;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;font-family:var(--font);letter-spacing:.04em;color:var(--ink)}
.admin-btn:hover{border-color:var(--ink)}
.admin-btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.admin-btn-primary:hover{background:#333;border-color:#333}
.admin-btn-success{background:#1d6f3d;color:#fff;border-color:#1d6f3d}
.admin-btn-success:hover{background:#155a30;border-color:#155a30}
.admin-btn-danger{background:#a83232;color:#fff;border-color:#a83232}
.admin-btn-danger:hover{background:#8a2828;border-color:#8a2828}
.admin-btn-small{padding:.35rem .65rem;font-size:11px}
.admin-empty{padding:3rem 1rem;text-align:center;color:var(--mid);font-size:13px}
/* Applications list */
.app-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;margin-bottom:.75rem;display:grid;grid-template-columns:48px 1fr auto;gap:1rem;align-items:start}
.app-thumb{width:48px;height:48px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mid)}
.app-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.app-main h3{font-size:14px;font-weight:600;margin-bottom:.25rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.app-status{display:inline-block;padding:.15rem .5rem;font-size:10px;font-weight:600;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.app-status-pending{background:#fff3cd;color:#856404}
.app-status-approved{background:#d4edda;color:#155724}
.app-status-rejected{background:#f8d7da;color:#721c24}
.app-meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.4rem 1rem;font-size:12px;color:var(--ink-soft);margin-top:.4rem}
.app-meta strong{color:var(--ink);font-weight:600}
.app-message{font-size:12px;color:var(--ink-soft);margin-top:.5rem;padding:.5rem .65rem;background:var(--bg);border-radius:4px;line-height:1.45}
.app-notes{font-size:12px;color:#721c24;margin-top:.4rem;padding:.5rem .65rem;background:#f8d7da;border-radius:4px}
.app-actions{display:flex;flex-direction:column;gap:.4rem}
/* Catalog list */
.cat-row{background:#fff;border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;margin-bottom:.5rem;display:grid;grid-template-columns:48px 1fr auto;gap:.85rem;align-items:center}
.cat-row.inactive{opacity:.5}
.cat-thumb{width:48px;height:48px;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mid)}
.cat-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.cat-info h4{font-size:13px;font-weight:600;margin-bottom:.2rem}
.cat-info-meta{font-size:11px;color:var(--mid);display:flex;gap:.6rem;flex-wrap:wrap}
.cat-actions{display:flex;gap:.4rem;align-items:center}
.cat-toggle{display:inline-flex;align-items:center;gap:.3rem;font-size:11px;color:var(--ink-soft);cursor:pointer}
.cat-toggle input{cursor:pointer}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-overlay.visible{display:flex}
.modal{background:#fff;border-radius:10px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem 1.75rem}
.modal h2{font-size:16px;font-weight:600;margin-bottom:1rem}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.modal label{display:block;font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin:.85rem 0 .25rem}
.modal input[type=text],.modal input[type=number],.modal input[type=url],.modal select,.modal textarea{width:100%;padding:.55rem .6rem;font-size:13px;border:1px solid var(--border);border-radius:4px;background:#fff;font-family:var(--font);color:var(--ink)}
.modal input[type=file]{font-size:12px;width:100%;margin-top:.2rem}
.modal textarea{resize:vertical;min-height:60px}
.modal-row-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}
.modal-error{display:none;background:#f8d7da;color:#721c24;padding:.5rem .7rem;font-size:12px;border-radius:4px;margin-top:.6rem}
.modal-existing{font-size:11px;color:var(--mid);margin-top:.2rem}
.modal-existing a{color:var(--coral);text-decoration:none}
.modal-existing a:hover{text-decoration:underline}
.modal-progress{display:none;background:#fff8e1;color:#8a6d1c;padding:.5rem .7rem;font-size:12px;border-radius:4px;margin-top:.6rem}
@media(max-width:600px){
  .admin-pane{padding:1rem}
  .modal-row{grid-template-columns:1fr}
  .app-card{grid-template-columns:1fr}
  .app-actions{flex-direction:row;flex-wrap:wrap}
}
</style>
</head>
<body class="hidden-until-auth">

<header class="admin-header">
  <h1>Curino <span>Admin</span></h1>
  <nav>
    <a href="/mi-cuenta/">Mi cuenta</a>
    <button onclick="adminSignOut()">Cerrar sesión</button>
  </nav>
</header>

<div class="admin-tabs">
  <button class="admin-tab active" data-pane="apps" onclick="switchPane('apps')">Solicitudes <span id="appCount" style="opacity:.5;margin-left:.3rem"></span></button>
  <button class="admin-tab" data-pane="catalog" onclick="switchPane('catalog')">Catálogo <span id="catCount" style="opacity:.5;margin-left:.3rem"></span></button>
</div>

<!-- Solicitudes -->
<div class="admin-pane active" id="apps-pane">
  <div class="admin-toolbar">
    <label>Estado <select id="appFilter" onchange="renderApps()">
      <option value="">Todos</option>
      <option value="pending" selected>Pendientes</option>
      <option value="approved">Aprobadas</option>
      <option value="rejected">Rechazadas</option>
    </select></label>
    <button class="admin-btn admin-btn-small" onclick="loadApps()">Recargar</button>
  </div>
  <div id="appList"><div class="admin-empty">Cargando…</div></div>
</div>

<!-- Catálogo -->
<div class="admin-pane" id="catalog-pane">
  <div class="admin-toolbar">
    <label>Categoría <select id="catFilterCategory" onchange="onCatFilterCategoryChange()"><option value="">Todas</option></select></label>
    <label>Subcategoría <select id="catFilterSub"><option value="">Todas</option></select></label>
    <label>Marca <select id="catFilterBrand"><option value="">Todas</option></select></label>
    <label><input type="checkbox" id="catFilterInactive"> Mostrar inactivas</label>
    <button class="admin-btn admin-btn-small" onclick="loadCatalog()">Recargar</button>
    <button class="admin-btn admin-btn-primary admin-btn-small" onclick="openItemModal()" style="margin-left:auto">+ Añadir pieza</button>
  </div>
  <div id="catList"><div class="admin-empty">Cargando…</div></div>
</div>

<!-- Modal: añadir/editar pieza -->
<div class="modal-overlay" id="itemModalOverlay">
  <div class="modal">
    <h2 id="itemModalTitle">Añadir pieza</h2>
    <form id="itemForm" onsubmit="saveItem(event)">
      <input type="hidden" id="itemId">
      <label>Nombre *</label>
      <input type="text" id="itemName" required maxlength="120">
      <label>Marca *</label>
      <input type="text" id="itemBrand" required maxlength="80">
      <div class="modal-row">
        <div>
          <label>Categoría *</label>
          <select id="itemCategory" required onchange="onItemCategoryChange()">
            <option value="">—</option>
          </select>
        </div>
        <div>
          <label>Subcategoría *</label>
          <select id="itemSubcategory" required>
            <option value="">—</option>
          </select>
        </div>
      </div>
      <div class="modal-row">
        <div>
          <label>Diseñador</label>
          <input type="text" id="itemDesigner" maxlength="80">
        </div>
        <div>
          <label>Año</label>
          <input type="number" id="itemYear" min="1800" max="2100">
        </div>
      </div>
      <div class="modal-row">
        <div>
          <label>Ancho (mm)</label>
          <input type="number" id="itemW" min="0">
        </div>
        <div>
          <label>Alto (mm)</label>
          <input type="number" id="itemH" min="0">
        </div>
      </div>
      <div class="modal-row">
        <div>
          <label>Profundidad (mm)</label>
          <input type="number" id="itemD" min="0">
        </div>
        <div>
          <label>Unidad por defecto del DXF</label>
          <select id="itemUnit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="in">pulgadas</option>
            <option value="ft">pies</option>
          </select>
        </div>
      </div>
      <label>DXF *</label>
      <input type="file" id="itemDxf" accept=".dxf">
      <div class="modal-existing" id="itemDxfExisting"></div>
      <label>Thumbnail (PNG/JPG, opcional)</label>
      <input type="file" id="itemThumb" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      <div class="modal-existing" id="itemThumbExisting"></div>
      <label style="display:flex;align-items:center;gap:.5rem;margin-top:1rem;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">
        <input type="checkbox" id="itemActive" checked> Activa (visible en el catálogo público)
      </label>
      <div class="modal-error" id="itemModalError"></div>
      <div class="modal-progress" id="itemModalProgress"></div>
      <div class="modal-row-actions">
        <button type="button" class="admin-btn" onclick="closeItemModal()">Cancelar</button>
        <button type="submit" class="admin-btn admin-btn-primary" id="itemSaveBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
// ─── CATEGORIES ────────────────────────────────────────────────────────────
// Mirror of CATALOG_CATEGORIES in configurador-2d/index.html. Kept in sync
// manually here — when adding/renaming categories, update both files.
var CATEGORIES=[
  {key:'asientos',label:'Asientos',subs:[
    {key:'sillas',label:'Sillas'},{key:'butacas',label:'Butacas'},
    {key:'sofas',label:'Sofás'},{key:'taburetes',label:'Taburetes'}
  ]},
  {key:'mesas',label:'Mesas',subs:[
    {key:'comedor',label:'Comedor'},{key:'centro',label:'Centro'},
    {key:'auxiliares',label:'Auxiliares'},{key:'despacho',label:'Despacho'}
  ]},
  {key:'almacenamiento',label:'Almacenamiento',subs:[
    {key:'estanterias',label:'Estanterías'},{key:'aparadores',label:'Aparadores'},
    {key:'comodas',label:'Cómodas'},{key:'vestidores',label:'Vestidores'}
  ]},
  {key:'iluminacion',label:'Iluminación',subs:[
    {key:'sobremesa',label:'Sobremesa'},{key:'pie',label:'Pie'},
    {key:'suspension',label:'Suspensión'},{key:'aplique',label:'Aplique'}
  ]},
  {key:'camas',label:'Camas',subs:[
    {key:'individuales',label:'Individuales'},{key:'matrimonio',label:'Matrimonio'},
    {key:'cabeceros',label:'Cabeceros'}
  ]},
  {key:'exterior',label:'Exterior',subs:[
    {key:'sillas',label:'Sillas'},{key:'mesas',label:'Mesas'},{key:'sombrillas',label:'Sombrillas'}
  ]},
  {key:'decoracion',label:'Decoración',subs:[
    {key:'alfombras',label:'Alfombras'},{key:'espejos',label:'Espejos'},{key:'plantas',label:'Plantas'}
  ]}
];
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(s){if(!s) return '';try{return new Date(s).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return s;}}

// ─── BOOTSTRAP ─────────────────────────────────────────────────────────────
var _supabase=null,_currentUser=null,_apps=[],_items=[];

(async function(){
  try{
    var r=await fetch('/api/config',{redirect:'follow'});
    var c=await r.json();
    if(!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase){
      window.location.href='/login/?redirect=/admin/';return;
    }
    _supabase=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);
    var s=await _supabase.auth.getSession();
    if(!s.data.session){
      window.location.href='/login/?redirect=/admin/';return;
    }
    _currentUser=s.data.session.user;
    // Verify admin role before showing anything.
    var rr=await _supabase.from('user_roles').select('role').eq('user_id',_currentUser.id).maybeSingle();
    if(!rr.data||rr.data.role!=='admin'){
      // Silent redirect — the modal felt heavy for a routine "wrong page"
      // event. Combined with hidden-until-auth, the user just sees a brief
      // blank flash before landing back on /mi-cuenta/.
      window.location.href='/mi-cuenta/';return;
    }
    initAdmin();
  }catch(e){
    console.error('admin bootstrap',e);
    window.location.href='/login/?redirect=/admin/';
  }
})();

function initAdmin(){
  // Reveal the page only after the admin role has been confirmed.
  document.body.classList.remove('hidden-until-auth');
  populateCategorySelects();
  loadApps();
  loadCatalog();
}
async function adminSignOut(){
  if(_supabase) await _supabase.auth.signOut();
  window.location.href='/login/';
}
function switchPane(name){
  document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.toggle('active',t.dataset.pane===name);});
  document.querySelectorAll('.admin-pane').forEach(function(p){p.classList.toggle('active',p.id===name+'-pane');});
}

// ─── APPLICATIONS ──────────────────────────────────────────────────────────
async function loadApps(){
  var list=document.getElementById('appList');
  list.innerHTML='<div class="admin-empty">Cargando…</div>';
  var r=await _supabase.rpc('admin_brand_applications_with_email');
  if(r.error){
    list.innerHTML='<div class="admin-empty">Error: '+escHtml(r.error.message)+'</div>';
    console.error(r.error);return;
  }
  _apps=r.data||[];
  document.getElementById('appCount').textContent=_apps.length?'('+_apps.length+')':'';
  renderApps();
}
function renderApps(){
  var list=document.getElementById('appList');
  var filter=document.getElementById('appFilter').value;
  var rows=filter?_apps.filter(function(a){return a.status===filter;}):_apps;
  if(rows.length===0){list.innerHTML='<div class="admin-empty">No hay solicitudes con ese filtro.</div>';return;}
  list.innerHTML=rows.map(function(a){
    var thumb=a.logo_url?'<img src="'+escHtml(a.logo_url)+'" alt="">':'logo';
    var statusClass='app-status app-status-'+a.status;
    var actions='';
    if(a.status==='pending'){
      actions=
        '<button class="admin-btn admin-btn-success admin-btn-small" onclick="approveApp(\''+a.id+'\')">Aprobar</button>'+
        '<button class="admin-btn admin-btn-danger admin-btn-small" onclick="rejectApp(\''+a.id+'\')">Rechazar</button>';
    }else{
      actions='<span style="font-size:11px;color:var(--mid)">Revisada</span>';
    }
    return ''+
      '<div class="app-card">'+
        '<div class="app-thumb">'+thumb+'</div>'+
        '<div class="app-main">'+
          '<h3>'+escHtml(a.brand_name)+' <span class="'+statusClass+'">'+statusFor(a.status)+'</span></h3>'+
          '<div class="app-meta">'+
            '<div><strong>Razón social:</strong> '+escHtml(a.legal_name)+'</div>'+
            '<div><strong>CIF/NIF:</strong> '+escHtml(a.cif_nif)+'</div>'+
            '<div><strong>Contacto:</strong> '+escHtml(a.contact_name)+'</div>'+
            '<div><strong>Email:</strong> '+escHtml(a.user_email||'(no disponible)')+'</div>'+
            '<div><strong>Teléfono:</strong> '+escHtml(a.phone)+'</div>'+
            '<div><strong>Web:</strong> '+(a.website?'<a href="'+escHtml(a.website)+'" target="_blank" rel="noopener">'+escHtml(a.website)+'</a>':'—')+'</div>'+
            '<div><strong>Solicitada:</strong> '+escHtml(fmtDate(a.created_at))+'</div>'+
            (a.reviewed_at?'<div><strong>Revisada:</strong> '+escHtml(fmtDate(a.reviewed_at))+'</div>':'')+
          '</div>'+
          (a.message?'<div class="app-message"><strong>Mensaje:</strong> '+escHtml(a.message)+'</div>':'')+
          (a.admin_notes?'<div class="app-notes"><strong>Notas admin:</strong> '+escHtml(a.admin_notes)+'</div>':'')+
        '</div>'+
        '<div class="app-actions">'+actions+'</div>'+
      '</div>';
  }).join('');
}
function statusFor(s){return s==='pending'?'Pendiente':s==='approved'?'Aprobada':'Rechazada';}

async function approveApp(id){
  var app=_apps.find(function(x){return x.id===id;});
  if(!app) return;
  // No confirm — click executes inmediately. Errors still surface via alert.
  // 1) actualizar la fila de la solicitud
  var u1=await _supabase.from('brand_applications').update({
    status:'approved',
    reviewed_at:new Date().toISOString(),
    reviewed_by:_currentUser.id,
    admin_notes:null
  }).eq('id',app.id);
  if(u1.error){alert('Error actualizando la solicitud: '+u1.error.message);return;}
  // 2) upsert en user_roles para promover al usuario a 'brand'
  var u2=await _supabase.from('user_roles').upsert({
    user_id:app.user_id,
    role:'brand',
    brand_name:app.brand_name,
    granted_at:new Date().toISOString(),
    granted_by:_currentUser.id
  },{onConflict:'user_id'});
  if(u2.error){alert('Error en user_roles (la solicitud quedó aprobada pero el rol no se asignó): '+u2.error.message);return;}
  await loadApps();
}
async function rejectApp(id){
  var app=_apps.find(function(x){return x.id===id;});
  if(!app) return;
  // No prompt — click executes inmediately, admin_notes queda NULL.
  // El usuario rechazado verá solo "Solicitud rechazada" sin motivo.
  var u=await _supabase.from('brand_applications').update({
    status:'rejected',
    reviewed_at:new Date().toISOString(),
    reviewed_by:_currentUser.id,
    admin_notes:null
  }).eq('id',app.id);
  if(u.error){alert('Error: '+u.error.message);return;}
  await loadApps();
}

// ─── CATALOG ───────────────────────────────────────────────────────────────
function populateCategorySelects(){
  ['catFilterCategory','itemCategory'].forEach(function(id){
    var sel=document.getElementById(id);
    if(!sel) return;
    var keep=sel.children[0].outerHTML;
    sel.innerHTML=keep+CATEGORIES.map(function(c){return '<option value="'+c.key+'">'+escHtml(c.label)+'</option>';}).join('');
  });
}
function onCatFilterCategoryChange(){
  var cat=document.getElementById('catFilterCategory').value;
  var sub=document.getElementById('catFilterSub');
  sub.innerHTML='<option value="">Todas</option>';
  if(cat){
    var c=CATEGORIES.find(function(x){return x.key===cat;});
    if(c){sub.innerHTML+=c.subs.map(function(s){return '<option value="'+s.key+'">'+escHtml(s.label)+'</option>';}).join('');}
  }
  renderCatalog();
}
function onItemCategoryChange(){
  var cat=document.getElementById('itemCategory').value;
  var sub=document.getElementById('itemSubcategory');
  sub.innerHTML='<option value="">—</option>';
  if(cat){
    var c=CATEGORIES.find(function(x){return x.key===cat;});
    if(c){sub.innerHTML+=c.subs.map(function(s){return '<option value="'+s.key+'">'+escHtml(s.label)+'</option>';}).join('');}
  }
}
async function loadCatalog(){
  var list=document.getElementById('catList');
  list.innerHTML='<div class="admin-empty">Cargando…</div>';
  // Admin RLS lets us see all rows (active=true and own/admin).
  var r=await _supabase.from('catalog_items').select('*').order('brand').order('name');
  if(r.error){list.innerHTML='<div class="admin-empty">Error: '+escHtml(r.error.message)+'</div>';return;}
  _items=r.data||[];
  document.getElementById('catCount').textContent=_items.length?'('+_items.length+')':'';
  // Populate brand filter
  var brands=Array.from(new Set(_items.map(function(it){return it.brand;}))).filter(Boolean).sort();
  var bf=document.getElementById('catFilterBrand');
  bf.innerHTML='<option value="">Todas</option>'+brands.map(function(b){return '<option value="'+escHtml(b)+'">'+escHtml(b)+'</option>';}).join('');
  bf.onchange=renderCatalog;
  document.getElementById('catFilterInactive').onchange=renderCatalog;
  renderCatalog();
}
function renderCatalog(){
  var list=document.getElementById('catList');
  var cat=document.getElementById('catFilterCategory').value;
  var sub=document.getElementById('catFilterSub').value;
  var brand=document.getElementById('catFilterBrand').value;
  var showInactive=document.getElementById('catFilterInactive').checked;
  var rows=_items.filter(function(it){
    if(cat && (it.category||'').toLowerCase()!==cat) return false;
    if(sub && (it.subcategory||'').toLowerCase()!==sub) return false;
    if(brand && it.brand!==brand) return false;
    if(!showInactive && !it.active) return false;
    return true;
  });
  if(rows.length===0){list.innerHTML='<div class="admin-empty">Sin piezas que coincidan con el filtro.</div>';return;}
  list.innerHTML=rows.map(function(it){
    var thumb=it.thumbnail_url?'<img src="'+escHtml(it.thumbnail_url)+'" alt="">':'thumb';
    return ''+
      '<div class="cat-row '+(it.active?'':'inactive')+'">'+
        '<div class="cat-thumb">'+thumb+'</div>'+
        '<div class="cat-info">'+
          '<h4>'+escHtml(it.name)+'</h4>'+
          '<div class="cat-info-meta">'+
            '<span>'+escHtml(it.brand)+'</span>'+
            '<span>'+escHtml(it.category||'')+(it.subcategory?' / '+escHtml(it.subcategory):'')+'</span>'+
            (it.year?'<span>'+it.year+'</span>':'')+
            (it.width_mm?'<span>'+it.width_mm+'×'+(it.height_mm||0)+(it.depth_mm?'×'+it.depth_mm:'')+' mm</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="cat-actions">'+
          '<label class="cat-toggle"><input type="checkbox" '+(it.active?'checked':'')+' onchange="toggleItemActive(\''+it.id+'\',this.checked)"> Activa</label>'+
          '<button class="admin-btn admin-btn-small" onclick="openItemModal(\''+it.id+'\')">Editar</button>'+
          '<button class="admin-btn admin-btn-danger admin-btn-small" onclick="deleteItem(\''+it.id+'\')">Borrar</button>'+
        '</div>'+
      '</div>';
  }).join('');
}
async function toggleItemActive(id,active){
  var u=await _supabase.from('catalog_items').update({active:active}).eq('id',id);
  if(u.error){alert('Error: '+u.error.message);loadCatalog();return;}
  // Update local cache to avoid full reload
  var it=_items.find(function(x){return x.id===id;});
  if(it) it.active=active;
}
async function deleteItem(id){
  var it=_items.find(function(x){return x.id===id;});
  if(!it) return;
  if(!confirm('Borrar la pieza "'+it.name+'" definitivamente?\n\nTambién se eliminarán el DXF y el thumbnail del Storage.')) return;
  // Delete files first (best-effort — if they fail, the row delete still happens)
  if(it.dxf_url){
    var dxfPath=storagePathFromUrl(it.dxf_url,'catalog-dxfs');
    if(dxfPath) await _supabase.storage.from('catalog-dxfs').remove([dxfPath]);
  }
  if(it.thumbnail_url){
    var thumbPath=storagePathFromUrl(it.thumbnail_url,'catalog-thumbnails');
    if(thumbPath) await _supabase.storage.from('catalog-thumbnails').remove([thumbPath]);
  }
  var d=await _supabase.from('catalog_items').delete().eq('id',id);
  if(d.error){alert('Error borrando la pieza: '+d.error.message);return;}
  await loadCatalog();
}
function storagePathFromUrl(url,bucket){
  // Public URL is .../storage/v1/object/public/<bucket>/<path>?... — extract <path>.
  var m=String(url||'').match(new RegExp('/storage/v1/object/public/'+bucket+'/([^?]+)'));
  return m?decodeURIComponent(m[1]):null;
}

// ─── ITEM MODAL ────────────────────────────────────────────────────────────
var _editingItem=null;
function openItemModal(id){
  _editingItem=id?_items.find(function(x){return x.id===id;}):null;
  document.getElementById('itemModalTitle').textContent=_editingItem?'Editar pieza':'Añadir pieza';
  document.getElementById('itemId').value=_editingItem?_editingItem.id:'';
  document.getElementById('itemName').value=_editingItem?_editingItem.name||'':'';
  document.getElementById('itemBrand').value=_editingItem?_editingItem.brand||'':'';
  document.getElementById('itemCategory').value=_editingItem?(_editingItem.category||'').toLowerCase():'';
  onItemCategoryChange();
  document.getElementById('itemSubcategory').value=_editingItem?(_editingItem.subcategory||'').toLowerCase():'';
  document.getElementById('itemDesigner').value=_editingItem?_editingItem.designer||'':'';
  document.getElementById('itemYear').value=_editingItem&&_editingItem.year?_editingItem.year:'';
  document.getElementById('itemW').value=_editingItem&&_editingItem.width_mm?_editingItem.width_mm:'';
  document.getElementById('itemH').value=_editingItem&&_editingItem.height_mm?_editingItem.height_mm:'';
  document.getElementById('itemD').value=_editingItem&&_editingItem.depth_mm?_editingItem.depth_mm:'';
  document.getElementById('itemUnit').value=_editingItem&&_editingItem.default_unit?_editingItem.default_unit:'mm';
  document.getElementById('itemActive').checked=_editingItem?!!_editingItem.active:true;
  document.getElementById('itemDxf').value='';
  document.getElementById('itemThumb').value='';
  // Default-view aware: show whatever DXF the configurador would pick on
  // drop (views.top → other views → legacy dxf_url). Save flow still writes
  // to the legacy column for now — Fase B will add per-view editing.
  var _defaultDxfUrl=_editingItem?CurinoCatalog.getDefaultDxfUrl(_editingItem):null;
  document.getElementById('itemDxfExisting').innerHTML=_defaultDxfUrl?'Actual: <a href="'+escHtml(_defaultDxfUrl)+'" target="_blank">'+escHtml(_defaultDxfUrl.split('/').pop())+'</a> (déjalo vacío para mantenerlo)':'';
  document.getElementById('itemThumbExisting').innerHTML=(_editingItem&&_editingItem.thumbnail_url)?'Actual: <a href="'+escHtml(_editingItem.thumbnail_url)+'" target="_blank">ver</a>':'';
  document.getElementById('itemModalError').style.display='none';
  document.getElementById('itemModalProgress').style.display='none';
  document.getElementById('itemModalOverlay').classList.add('visible');
}
function closeItemModal(){
  document.getElementById('itemModalOverlay').classList.remove('visible');
  _editingItem=null;
}
async function saveItem(e){
  e.preventDefault();
  var err=document.getElementById('itemModalError');
  var prog=document.getElementById('itemModalProgress');
  err.style.display='none';
  var btn=document.getElementById('itemSaveBtn');
  btn.disabled=true;
  var name=document.getElementById('itemName').value.trim();
  var brand=document.getElementById('itemBrand').value.trim();
  var category=document.getElementById('itemCategory').value;
  var subcategory=document.getElementById('itemSubcategory').value;
  var designer=document.getElementById('itemDesigner').value.trim();
  var year=parseInt(document.getElementById('itemYear').value,10)||null;
  var width_mm=parseInt(document.getElementById('itemW').value,10)||null;
  var height_mm=parseInt(document.getElementById('itemH').value,10)||null;
  var depth_mm=parseInt(document.getElementById('itemD').value,10)||null;
  var default_unit=document.getElementById('itemUnit').value||'mm';
  var active=document.getElementById('itemActive').checked;
  var dxfFile=document.getElementById('itemDxf').files[0];
  var thumbFile=document.getElementById('itemThumb').files[0];

  function fail(msg){err.textContent=msg;err.style.display='block';prog.style.display='none';btn.disabled=false;}

  if(!name||!brand||!category||!subcategory){fail('Faltan campos obligatorios.');return;}
  if(!_editingItem&&!dxfFile){fail('El DXF es obligatorio al crear una pieza.');return;}
  if(dxfFile&&!/\.dxf$/i.test(dxfFile.name)){fail('El archivo DXF debe tener extensión .dxf.');return;}
  if(dxfFile&&dxfFile.size>10*1024*1024){fail('DXF demasiado grande (>10 MB).');return;}
  if(thumbFile&&thumbFile.size>2*1024*1024){fail('Thumbnail demasiado grande (>2 MB).');return;}

  var id=_editingItem?_editingItem.id:(window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():('xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);})));
  var dxf_url=_editingItem?_editingItem.dxf_url:null;
  var thumbnail_url=_editingItem?_editingItem.thumbnail_url:null;

  prog.style.display='block';prog.textContent='Subiendo archivos…';

  if(dxfFile){
    var dxfPath=id+'.dxf';
    var up1=await _supabase.storage.from('catalog-dxfs').upload(dxfPath,dxfFile,{upsert:true,contentType:'application/dxf'});
    if(up1.error){fail('Error subiendo DXF: '+up1.error.message);return;}
    dxf_url=_supabase.storage.from('catalog-dxfs').getPublicUrl(dxfPath).data.publicUrl;
  }
  if(thumbFile){
    var ext=(thumbFile.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!ext) ext='png';
    // Limpia thumbnails con otra extensión para mantener un único archivo por id.
    ['png','jpg','jpeg','webp','svg'].forEach(function(e){if(e!==ext) _supabase.storage.from('catalog-thumbnails').remove([id+'.'+e]);});
    var thumbPath=id+'.'+ext;
    var up2=await _supabase.storage.from('catalog-thumbnails').upload(thumbPath,thumbFile,{upsert:true,contentType:thumbFile.type});
    if(up2.error){fail('Error subiendo thumbnail: '+up2.error.message);return;}
    thumbnail_url=_supabase.storage.from('catalog-thumbnails').getPublicUrl(thumbPath).data.publicUrl;
  }

  prog.textContent='Guardando…';
  var payload={
    id:id,
    name:name, brand:brand,
    category:category, subcategory:subcategory,
    designer:designer||null, year:year,
    width_mm:width_mm, height_mm:height_mm, depth_mm:depth_mm,
    dxf_url:dxf_url||'', thumbnail_url:thumbnail_url,
    default_unit:default_unit, active:active
  };
  var op=_editingItem
    ?_supabase.from('catalog_items').update(payload).eq('id',id)
    :_supabase.from('catalog_items').insert(payload);
  var res=await op;
  if(res.error){fail('Error guardando la pieza: '+res.error.message);return;}
  prog.style.display='none';
  btn.disabled=false;
  closeItemModal();
  await loadCatalog();
}
</script>
