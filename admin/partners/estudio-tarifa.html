  </div>

<script>
initAdminShell({ activeSection: 'partners-estudio-tarifa', title: 'Partners · Tarifa del Estudio' }).then(function (c) {
  var ctx = { supa: c.supabase, modo: 'admin',
    rutas: {
      estudio: function (pid) { return '/admin/partners/estudio.html' + (pid ? '?p=' + pid : ''); },
      presupuesto: function (pid) { return '/admin/partners/estudio-presupuesto.html?p=' + pid; },
      datos: function () { return '/admin/partners/estudio-tarifa.html'; },
      tarifa: function () { return '/admin/partners/estudio-tarifa.html'; }
    } };
  EstudioUI.tarifa(document.getElementById('tfApp'), ctx, 'curino');
  EstudioUI.plantilla(document.getElementById('plApp'), ctx);
}).catch(function () {});
</script>
