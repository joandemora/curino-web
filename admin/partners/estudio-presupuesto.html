<!DOCTYPE html>

<head>

<title>Partners · Presupuesto del Estudio — Curino admin</title>
<link rel="icon" type="image/png" href="/assets/imagenes/favicon-curino.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">

<link rel="stylesheet" href="/assets/css/estudio-ui.css">
</head>
<body class="hidden-until-auth">
<main class="ash-content">
  <p><a id="prVolver" href="/admin/partners/estudio.html">← Estudio</a> · <a href="/admin/partners/estudio-tarifa.html">Tarifa y plantilla</a></p>
  <div id="prApp"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="/assets/js/admin-shell.js"></script>
<script src="/admin/partners/partners-admin.js"></script>
<script src="/assets/js/estudio-ui.js"></script>
<script>
initAdminShell({ activeSection: 'partners-estudio', title: 'Partners · Presupuesto' }).then(function (c) {
  var pid = new URLSearchParams(location.search).get('p') || '';
  document.getElementById('prVolver').href = '/admin/partners/estudio.html?p=' + encodeURIComponent(pid);
  EstudioUI.presupuesto(document.getElementById('prApp'), {
    supa: c.supabase, modo: 'admin',
    rutas: {
      estudio: function (pid) { return '/admin/partners/estudio.html' + (pid ? '?p=' + pid : ''); },
      presupuesto: function (pid) { return '/admin/partners/estudio-presupuesto.html?p=' + pid; },
      datos: function () { return '/admin/partners/estudio-tarifa.html'; },
      tarifa: function () { return '/admin/partners/estudio-tarifa.html'; }
    }
  }, pid);
}).catch(function () {});
</script>
</body>
</html>
