[functions.presupuesto-form-relay]
enabled = true
verify_jwt = false
import_map = "./functions/presupuesto-form-relay/deno.json"
entrypoint = "./functions/presupuesto-form-relay/index.ts"
# verify_jwt=false: la función es invocada server-to-server desde Vercel
# (api/solicitar-presupuesto) con el ANON_KEY como apikey, sin user JWT real.
# Coherente con magazine-relay-contact (también desplegada con verify_jwt=false
# aunque no aparezca en este config.toml por ser anterior a la entrada en la CLI).

[functions.clases-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/clases-checkout/deno.json"
entrypoint = "./functions/clases-checkout/index.ts"
# verify_jwt=false: invitado. Desde 2026-10 vende el Intensivo Curino
# Partners (990 EUR, aforo 20) desde el formulario de /partners/.
# Invocada server-to-server desde /api/clases-checkout con ANON_KEY.

[functions.notify-class-reminder]
enabled = true
verify_jwt = false
import_map = "./functions/notify-class-reminder/deno.json"
entrypoint = "./functions/notify-class-reminder/index.ts"
# verify_jwt=false: invocada por pg_cron via net.http_post. Autenticación
# propia por header X-Cron-Secret vs env CRON_SECRET.

[functions.lista-espera-relay]
enabled = true
verify_jwt = false
import_map = "./functions/lista-espera-relay/deno.json"
entrypoint = "./functions/lista-espera-relay/index.ts"
# verify_jwt=false: form público de captura de email cuando no hay clase
# abierta. Invocada desde /api/lista-espera con ANON_KEY. Hardening propio
# (honeypot + rate limit por hash IP en tabla lista_espera).

[functions.curso-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/curso-checkout/deno.json"
entrypoint = "./functions/curso-checkout/index.ts"
# verify_jwt=false: fosil del curso pregrabado de 90 EUR (retirado de la
# venta en 2026-10). Sin punto de entrada publico: /api/curso-checkout se
# elimino al pasar /partners/ a landing de solicitud. Se conserva desplegada.

[functions.curso-acceso]
enabled = true
verify_jwt = false
import_map = "./functions/curso-acceso/deno.json"
entrypoint = "./functions/curso-acceso/index.ts"
# verify_jwt=false: valida el access_token del email de confirmacion.
# Invocada desde /api/curso-acceso con ANON_KEY. Siempre HTTP 200
# (nunca 404 al usuario); el body dice {ok:false} para tokens invalidos.

[functions.partners-solicitud]
enabled = true
verify_jwt = false
import_map = "./functions/partners-solicitud/deno.json"
entrypoint = "./functions/partners-solicitud/index.ts"
# verify_jwt=false: formulario multipaso publico de /partners/ (2026-10).
# Invocada desde /api/partners-solicitud con ANON_KEY. Hardening propio
# (honeypot + rate limit por hash IP); pasos 1-4 y CTA final autenticados
# con id + edit_token opaco devuelto en el paso 0.

[functions.partners-formaciones]
enabled = true
verify_jwt = false
import_map = "./functions/partners-formaciones/deno.json"
entrypoint = "./functions/partners-formaciones/index.ts"
# verify_jwt=false: /partners/formaciones (publica). Invocada desde
# /api/partners-formaciones con ANON_KEY. Acciones info/checkout/baja; el
# lead se identifica con token HMAC (PARTNERS_LEAD_SECRET).

[functions.partners-seguimiento]
enabled = true
verify_jwt = false
import_map = "./functions/partners-seguimiento/deno.json"
entrypoint = "./functions/partners-seguimiento/index.ts"
# verify_jwt=false: invocada por pg_cron cada 15 min. Auth propia por
# X-Cron-Secret. No envia nada mientras PARTNERS_SEGUIMIENTO_ACTIVO != 'true'
# (salvo modo prueba sobre solicitudes "PRUEBA").

[functions.crm-email]
enabled = true
verify_jwt = true
import_map = "./functions/crm-email/deno.json"
entrypoint = "./functions/crm-email/index.ts"
# verify_jwt=true + comprobacion propia de user_roles.role = 'admin'.
# Invocada desde /admin/partners/emails.html con el JWT del admin.

[functions.resend-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/resend-webhook/deno.json"
entrypoint = "./functions/resend-webhook/index.ts"
# verify_jwt=false: lo llama Resend. Firma Svix con RESEND_WEBHOOK_SECRET.
