[functions.presupuesto-form-relay]
enabled = true
verify_jwt = false
import_map = "./functions/presupuesto-form-relay/deno.json"
entrypoint = "./functions/presupuesto-form-relay/index.ts"
# verify_jwt=false: la función es invocada server-to-server desde Vercel
# (api/solicitar-presupuesto) con el ANON_KEY como apikey, sin user JWT real.
# Coherente con magazine-relay-contact (también desplegada con verify_jwt=false
# aunque no aparezca en este config.toml por ser anterior a la entrada en la CLI).

[functions.clases-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/clases-checkout/deno.json"
entrypoint = "./functions/clases-checkout/index.ts"
# verify_jwt=false: invitado, la landing /clases es pública. Invocada
# server-to-server desde /api/clases-checkout con ANON_KEY como apikey.

[functions.notify-class-reminder]
enabled = true
verify_jwt = false
import_map = "./functions/notify-class-reminder/deno.json"
entrypoint = "./functions/notify-class-reminder/index.ts"
# verify_jwt=false: invocada por pg_cron via net.http_post. Autenticación
# propia por header X-Cron-Secret vs env CRON_SECRET.

[functions.lista-espera-relay]
enabled = true
verify_jwt = false
import_map = "./functions/lista-espera-relay/deno.json"
entrypoint = "./functions/lista-espera-relay/index.ts"
# verify_jwt=false: form público de captura de email cuando no hay clase
# abierta. Invocada desde /api/lista-espera con ANON_KEY. Hardening propio
# (honeypot + rate limit por hash IP en tabla lista_espera).

[functions.curso-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/curso-checkout/deno.json"
entrypoint = "./functions/curso-checkout/index.ts"
# verify_jwt=false: invitado, curso comprable 24/7 desde /clases/.
# Invocada server-to-server desde /api/curso-checkout con ANON_KEY.

[functions.curso-acceso]
enabled = true
verify_jwt = false
import_map = "./functions/curso-acceso/deno.json"
entrypoint = "./functions/curso-acceso/index.ts"
# verify_jwt=false: valida el access_token del email de confirmacion.
# Invocada desde /api/curso-acceso con ANON_KEY. Siempre HTTP 200
# (nunca 404 al usuario); el body dice {ok:false} para tokens invalidos.
