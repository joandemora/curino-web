<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo &mdash; Curino</title>
<link rel="icon" type="image/png" href="/assets/imagenes/favicon-curino.png">
<link rel="apple-touch-icon" href="/assets/imagenes/favicon-curino.png">
<meta http-equiv="refresh" content="0;url=/login/?redirect=/checkout/">
<link rel="canonical" href="/login/?redirect=/checkout/">
</head>
<body>
<script>
// Curino ya no usa checkout login separado con password. /login/ unifica todo
// vía OTP. Mantenemos el redirect a /checkout/ tras autenticarse.
window.location.replace('/login/?redirect=/checkout/');
</script>
<p>Redirigiendo a <a href="/login/?redirect=/checkout/">/login/</a>…</p>
</body>
</html>
