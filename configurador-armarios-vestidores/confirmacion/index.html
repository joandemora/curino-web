<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido confirmado — Curino</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/imagenes/favicon-curino.png">
<link rel="apple-touch-icon" href="/assets/imagenes/favicon-curino.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site-shell.css">

<style>
.confirm-wrap{max-width:680px;margin:0 auto;padding:80px 24px 48px;text-align:center}
.confirm-mark{font-family:var(--rv-serif);font-size:48px;line-height:1;color:var(--rv-ink);margin:0 0 24px}
.confirm-title{font-family:var(--rv-serif);font-size:clamp(28px,3.2vw,40px);font-weight:400;line-height:1.15;letter-spacing:-.01em;color:var(--rv-ink);margin:0 0 18px}
.confirm-lead{font-family:var(--rv-sans);font-size:15px;line-height:1.65;color:var(--rv-ink-soft);max-width:520px;margin:0 auto 36px}
.confirm-meta{font-family:var(--rv-sans);font-size:12px;letter-spacing:.04em;color:var(--rv-ink-mute);margin:0 auto 40px;padding:18px 24px;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;max-width:420px;display:flex;flex-direction:column;gap:8px}
.confirm-meta b{color:var(--rv-ink);font-weight:600;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em}
.confirm-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.confirm-cta{display:inline-block;padding:14px 28px;font-size:12px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:1px solid var(--rv-ink);transition:background .2s,color .2s}
.confirm-cta-primary{background:var(--rv-ink);color:#fff}
.confirm-cta-primary:hover{background:#333}
.confirm-cta-outline{background:transparent;color:var(--rv-ink)}
.confirm-cta-outline:hover{background:var(--rv-ink);color:#fff}
.confirm-foot{font-family:var(--rv-sans);font-size:12px;color:var(--rv-ink-mute);margin:48px 0 0;line-height:1.6}
.confirm-foot a{color:var(--rv-ink);text-decoration:underline}
.confirm-error .confirm-mark{color:#a83232}
@media (max-width:600px){
  .confirm-wrap{padding:48px 20px 32px}
  .confirm-ctas{flex-direction:column;align-items:stretch}
}
</style>
<!-- Google Consent Mode v2 + GTM (GTM-NZR7NNTC). Defaults denied; granted solo si el usuario aceptó en visita previa (localStorage.curino_consent==='granted'). El banner /assets/js/cookie-banner.js actualiza el consent en runtime. -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{ad_storage:'denied',analytics_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',functionality_storage:'granted',security_storage:'granted',wait_for_update:500});
try{if(localStorage.getItem('curino_consent')==='granted'){gtag('consent','update',{ad_storage:'granted',analytics_storage:'granted',ad_user_data:'granted',ad_personalization:'granted'});}}catch(_){}
</script>
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-NZR7NNTC');</script>
</head>
<body class="sx-page">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NZR7NNTC" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- NAV -->
<div id="main-nav-mount"></div>
<script src="/assets/js/main-nav.js"></script>

<section class="confirm-wrap" id="confirmRoot">
  <p class="confirm-mark">·</p>
  <h1 class="confirm-title">Cargando…</h1>
</section>

<div id="main-footer-mount"></div>
<script src="/assets/js/main-footer.js"></script>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');
  var root = document.getElementById('confirmRoot');

  if (!sessionId) {
    root.className = 'confirm-wrap confirm-error';
    root.innerHTML =
      '<p class="confirm-mark">·</p>' +
      '<h1 class="confirm-title">Sesión no encontrada</h1>' +
      '<p class="confirm-lead">No se ha encontrado información del pedido. Si has completado un pago, escríbenos a <a href="mailto:info@casacurino.com" style="color:var(--rv-ink)">info@casacurino.com</a> y te ayudamos.</p>' +
      '<div class="confirm-ctas"><a href="/" class="confirm-cta confirm-cta-outline">Volver al inicio</a></div>';
    return;
  }

  // Capturar num_items del carrito ANTES de vaciarlo (para el evento purchase).
  // Stripe no conoce el num_items real: api/checkout.js envía un único line_item
  // con quantity:1 sumando los precios en el frontend. localStorage es el único
  // origen fiable. Edge case raro: si el usuario editó el carrito en otra pestaña
  // durante el pago en Stripe, este número puede no reflejar exactamente lo pagado.
  var _purchaseNumItems = 0;
  try {
    var _cartSnap = JSON.parse(localStorage.getItem('curino_cart') || '[]');
    _purchaseNumItems = Array.isArray(_cartSnap) ? _cartSnap.length : 0;
  } catch(_){}

  // Vaciar carrito tras confirmación de pago
  try { localStorage.removeItem('curino_cart'); } catch(_){}

  // Mostrar los primeros caracteres del session_id como referencia
  // (Stripe la usa para soporte; el cliente verá el ID completo en su email).
  var ref = sessionId.slice(0, 24);

  root.innerHTML =
    '<p class="confirm-mark">·</p>' +
    '<h1 class="confirm-title">Hemos recibido tu pedido</h1>' +
    '<p class="confirm-lead">Gracias por tu compra en Curino. El pago se ha procesado correctamente y te hemos enviado un email con la confirmación y la factura adjunta en PDF.</p>' +
    '<div class="confirm-meta">' +
      '<div>Pago recibido</div>' +
      '<div>Plazo de fabricación &mdash; 4 a 5 semanas</div>' +
      '<div>Referencia: <b>' + ref + '</b></div>' +
    '</div>' +
    '<div class="confirm-ctas">' +
      '<a href="/mi-cuenta/" class="confirm-cta confirm-cta-primary">Ver mis pedidos</a>' +
      '<a href="/" class="confirm-cta confirm-cta-outline">Volver al inicio</a>' +
    '</div>' +
    '<p class="confirm-foot">¿No te ha llegado el email en unos minutos? Revisa tu carpeta de spam o escríbenos a <a href="mailto:info@casacurino.com">info@casacurino.com</a>.</p>';

  // Evento GA4 purchase — TRAS pintar la página, sin bloquear el render.
  // /api/stripe-session verifica la sesión contra Stripe y solo devuelve
  // datos si payment_status==='paid'. Si no está paid o si la API falla,
  // no se dispara el evento (silencioso). GA4 deduplica por transaction_id
  // si el usuario recarga. El push entra al dataLayer; GTM lo enviará a
  // GA4 solo si analytics_storage está 'granted' (Consent Mode v2).
  setTimeout(function(){
    try {
      fetch('/api/stripe-session?session_id=' + encodeURIComponent(sessionId))
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (!data || !data.paid) return;
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'purchase',
            ecommerce: {
              transaction_id: data.transaction_id,
              value: data.amount_total,
              currency: data.currency,
              num_items: _purchaseNumItems
            }
          });
        })
        .catch(function(){ /* silencioso: la compra ya está procesada server-side */ });
    } catch(_){}
  }, 0);
})();
</script>

<script src="/assets/js/cookie-banner.js" defer></script>
</body>
</html>
