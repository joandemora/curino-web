<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo &mdash; Curino</title>
<link rel="icon" type="image/png" href="/assets/imagenes/favicon-curino.png">
<link rel="apple-touch-icon" href="/assets/imagenes/favicon-curino.png">
<meta http-equiv="refresh" content="0;url=/login/">
<link rel="canonical" href="/login/">
</head>
<body>
<script>
// Curino ya no usa registro separado con password. /login/ unifica login + registro
// vía OTP (código por email). Preservamos el query param ?redirect= si existe.
var qs = window.location.search || '';
window.location.replace('/login/' + qs);
</script>
<p>Redirigiendo a <a href="/login/">/login/</a>…</p>
</body>
</html>
