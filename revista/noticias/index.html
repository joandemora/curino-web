<section class="revista-hero-title">
  <h1>Noticias</h1>
  <p class="subtitle">Noticias del mundo del mueble, la arquitectura y el diseño de interiores.</p>
</section>

<nav class="revista-nav">

<section class="revista-featured" id="featured" style="display:none">
  <a href="#" id="featuredLink" style="display:contents">
    <div class="revista-featured-img" id="featuredImg"></div>
    <div class="revista-featured-text">
      <div class="revista-featured-type" id="featuredType"></div>
      <h2 id="featuredTitle"></h2>
      <p class="revista-featured-desc" id="featuredDesc"></p>
      <span class="revista-featured-link">Leer artículo →</span>
    </div>
  </a>
</section>

<section class="revista-grid" id="gridWrap">
  <div id="grid"><div style="text-align:center;color:#888;padding:60px 0">Cargando…</div></div>
  <div class="revista-load-more" id="loadMoreWrap" style="display:none">
    <button id="loadMoreBtn" onclick="loadMore()">Cargar más</button>
  </div>
</section>

<div id="rv-footer-mount"></div>

<script src="/assets/js/revista-shell.js"></script>
<script src="/assets/js/image-transform.js"></script>
<script>
function imgT(url,preset){return (window.transformImageUrl?window.transformImageUrl(url,preset):url)||'';}
var SECTION_TYPE='noticia';
var SECTION_SLUG='noticias';
var SECTION_LABEL='Noticia';
var PAGE_SIZE=12;
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var _supa=null,_supaUrl=null,_offset=0,_total=null,_featuredId=null,_renderedFirstRow=false;

(async function(){
  try{
    var r=await fetch('/api/config',{redirect:'follow'});
    var c=await r.json();
    if(!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase) return;
    _supa=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);
    _supaUrl=c.supabaseUrl;
    triggerBoostActivation();
    await loadFeatured();
    await loadBatch(true);
  }catch(e){
    console.error('section',e);
    document.getElementById('grid').innerHTML='<div style="text-align:center;color:#888;padding:60px 0">Error al cargar.</div>';
  }
})();

function triggerBoostActivation(){
  (async function(){
    try{
      var r=await _supa.rpc('activate_boost_queue');
      if(r&&r.data&&Array.isArray(r.data.activated_ids)&&r.data.activated_ids.length>0){
        fetch(_supaUrl+'/functions/v1/magazine-notify-boost-active',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+(_supa.supabaseKey||'')},
          body:JSON.stringify({boost_ids:r.data.activated_ids})
        }).catch(function(){});
      }
    }catch(e){console.warn('activate_boost_queue',e);}
  })();
}

async function loadFeatured(){
  // Featured: boost section_cover de este type (random entre activos) si hay, fallback al último publicado de este type.
  var bRes=await _supa.from('magazine_boosts_active')
    .select('article_id,title,slug,article_type,cover_image_url,author_first_name,author_last_name,published_at,boost_type')
    .eq('boost_type','section_cover')
    .eq('article_type',SECTION_TYPE);
  var boosts=(bRes&&bRes.data)?bRes.data:[];
  var picked=null;
  if(boosts.length>0){
    var b=boosts[Math.floor(Math.random()*boosts.length)];
    var r=await _supa.from('magazine_articles_public').select('id,title,slug,type,cover_image_url,meta_description,author_first_name,author_last_name,published_at').eq('id',b.article_id).maybeSingle();
    if(r&&r.data) picked=r.data;
  }
  if(!picked){
    var f=await _supa.from('magazine_articles_public')
      .select('id,title,slug,type,cover_image_url,meta_description,author_first_name,author_last_name,published_at')
      .eq('type',SECTION_TYPE)
      .order('published_at',{ascending:false})
      .limit(1)
      .maybeSingle();
    if(f&&f.data) picked=f.data;
  }
  if(!picked) return;
  _featuredId=picked.id;
  var seccion=SECTION_SLUG;
  document.getElementById('featuredLink').setAttribute('href','/revista/'+seccion+'/'+encodeURIComponent(picked.slug)+'/');
  var featCover=imgT(picked.cover_image_url,'hero');
  document.getElementById('featuredImg').style.backgroundImage=featCover?"url('"+featCover.replace(/'/g,"\\'")+"')":'';
  document.getElementById('featuredType').textContent=SECTION_LABEL;
  document.getElementById('featuredTitle').textContent=picked.title||'';
  document.getElementById('featuredDesc').textContent=picked.meta_description||'';
  document.getElementById('featured').style.display='';
}

async function loadBatch(reset){
  if(reset){_offset=0;_renderedFirstRow=false;document.getElementById('grid').innerHTML='';}
  var q=_supa.from('magazine_articles_public')
    .select('id,title,slug,cover_image_url,published_at',{count:'exact'})
    .eq('type',SECTION_TYPE)
    .order('published_at',{ascending:false})
    .range(_offset,_offset+PAGE_SIZE-1);
  if(_featuredId){
    q=q.neq('id',_featuredId);
  }
  var r=await q;
  var grid=document.getElementById('grid');
  if(r.error){grid.innerHTML='<div style="text-align:center;color:#888;padding:60px 0">Error al cargar.</div>';return;}
  _total=r.count;
  var items=r.data||[];
  if(items.length===0&&reset){
    if(!_featuredId){
      grid.innerHTML='<div style="text-align:center;color:#888;padding:60px 0">Próximamente la sección de '+SECTION_LABEL.toLowerCase()+'s. Vuelve pronto.</div>';
    }
    document.getElementById('loadMoreWrap').style.display='none';
    return;
  }
  renderItems(items);
  _offset+=items.length;
  var shown=_offset;
  // El featured no cuenta en el count del query (lo excluye con neq), así que _total ya es el resto.
  document.getElementById('loadMoreWrap').style.display=(_total!=null&&shown<_total)?'block':'none';
}

function renderItems(items){
  var grid=document.getElementById('grid');
  var html='';
  var startIdx=0;
  if(!_renderedFirstRow){
    var firstRow=items.slice(0,2);
    if(firstRow.length>0){
      html+='<div class="revista-grid-row cols-2">'+firstRow.map(renderCard).join('')+'</div>';
      _renderedFirstRow=true;
      startIdx=firstRow.length;
    }
  }
  var rest=items.slice(startIdx);
  for(var i=0;i<rest.length;i+=3){
    var chunk=rest.slice(i,i+3);
    html+='<div class="revista-grid-row cols-3">'+chunk.map(renderCard).join('')+'</div>';
  }
  grid.insertAdjacentHTML('beforeend',html);
}

async function loadMore(){
  var btn=document.getElementById('loadMoreBtn');
  btn.disabled=true;btn.textContent='Cargando…';
  await loadBatch(false);
  btn.disabled=false;btn.textContent='Cargar más';
}

function renderCard(a){
  var href='/revista/'+SECTION_SLUG+'/'+encodeURIComponent(a.slug)+'/';
  var cover=imgT(a.cover_image_url,'card');
  return '<a class="revista-card" href="'+href+'">'+
    '<div class="revista-card-img"'+(cover?' style="background-image:url(\''+escHtml(cover).replace(/'/g,'%27')+'\')"':'')+'></div>'+
    '<h3>'+escHtml(a.title||'')+'</h3>'+
  '</a>';
}
</script>
<script src="/assets/js/cookie-banner.js" defer></script>
