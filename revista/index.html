<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Revista | Curino</title>
<meta name="description" content="Proyectos, materiales y reflexiones para el diseño de interiores. La revista de Curino.">
<link rel="canonical" href="https://casacurino.com/revista/">

<meta property="og:type" content="website">
<meta property="og:title" content="De Revista | Curino">
<meta property="og:description" content="Proyectos, materiales y reflexiones para el diseño de interiores. La revista de Curino.">
<meta property="og:url" content="https://casacurino.com/revista/">
<meta property="og:image" content="https://casacurino.com/assets/imagenes/logo-curino.svg">
<meta property="og:site_name" content="Curino Revista">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="De Revista | Curino">
<meta name="twitter:description" content="Proyectos, materiales y reflexiones para el diseño de interiores.">

<link rel="icon" type="image/png" href="/assets/imagenes/logo-solo-curino.png">
<link rel="apple-touch-icon" href="/assets/imagenes/logo-solo-curino.png">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/revista-shell.css">
<link rel="stylesheet" href="/assets/css/revista.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="rv-nav-mount"></div>

<!-- Hero del título -->
<section class="revista-hero-title">
  <h1>De Revista</h1>
  <p class="subtitle">Proyectos, materiales y reflexiones para el diseño de interiores.</p>
</section>

<!-- Nav horizontal -->
<nav class="revista-nav">
  <a href="/revista/" class="active">Todo</a>
  <a href="/revista/proyectos/">Proyectos</a>
  <a href="/revista/materiales/">Materiales</a>
  <a href="/revista/articulos/">Artículos</a>
  <a href="/revista/noticias/">Noticias</a>
  <a href="/revista/entrevistas/">Entrevistas</a>
</nav>

<!-- Featured (boost main_page o último publicado) -->
<section class="revista-featured" id="featured" style="display:none">
  <a href="#" id="featuredLink" style="display:contents">
    <div class="revista-featured-img" id="featuredImg"></div>
    <div class="revista-featured-text">
      <div class="revista-featured-type" id="featuredType"></div>
      <h2 id="featuredTitle"></h2>
      <p class="revista-featured-desc" id="featuredDesc"></p>
      <span class="revista-featured-link">Leer artículo →</span>
    </div>
  </a>
</section>

<!-- Grid de cards -->
<section class="revista-grid" id="gridWrap">
  <div id="grid"><div style="text-align:center;color:#888;padding:60px 0">Cargando…</div></div>
</section>

<div id="rv-footer-mount"></div>

<script src="/assets/js/revista-shell.js"></script>
<script>
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var TYPE_TO_SECCION={proyecto:'proyectos',material:'materiales',articulo:'articulos',noticia:'noticias',entrevista:'entrevistas'};
var TYPE_LABELS={proyecto:'Proyecto',material:'Material',articulo:'Artículo',noticia:'Noticia',entrevista:'Entrevista'};

var _supa=null,_supaUrl=null;

(async function(){
  try{
    var r=await fetch('/api/config',{redirect:'follow'});
    var c=await r.json();
    if(!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase) return;
    _supa=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);
    _supaUrl=c.supabaseUrl;
    triggerBoostActivation();
    await loadAll();
  }catch(e){
    console.error('revista landing',e);
    document.getElementById('grid').innerHTML='<div style="text-align:center;color:#888;padding:60px 0">Error al cargar.</div>';
  }
})();

function triggerBoostActivation(){
  (async function(){
    try{
      var r=await _supa.rpc('activate_boost_queue');
      if(r&&r.data&&Array.isArray(r.data.activated_ids)&&r.data.activated_ids.length>0){
        fetch(_supaUrl+'/functions/v1/magazine-notify-boost-active',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+(_supa.supabaseKey||'')},
          body:JSON.stringify({boost_ids:r.data.activated_ids})
        }).catch(function(){});
      }
    }catch(e){console.warn('activate_boost_queue',e);}
  })();
}

async function loadAll(){
  // 1) boosts activos main_page (todos los types).
  // 2) todos los artículos publicados, los 30 más recientes.
  var boostsP=_supa.from('magazine_boosts_active')
    .select('article_id,title,slug,article_type,cover_image_url,author_first_name,author_last_name,published_at,boost_type')
    .eq('boost_type','main_page');
  var articlesP=_supa.from('magazine_articles_public')
    .select('id,title,slug,type,cover_image_url,meta_description,author_first_name,author_last_name,published_at')
    .order('published_at',{ascending:false})
    .limit(30);
  var [bRes,aRes]=await Promise.all([boostsP,articlesP]);
  var boosts=(bRes&&bRes.data)?bRes.data:[];
  var articles=(aRes&&aRes.data)?aRes.data:[];

  if(articles.length===0){
    document.getElementById('grid').innerHTML='<div style="text-align:center;color:#888;padding:60px 0">Próximamente más contenidos…</div>';
    return;
  }

  // Featured: boost main_page (random entre los activos) si existe, fallback último publicado.
  var featured=null;
  if(boosts.length>0){
    var pick=boosts[Math.floor(Math.random()*boosts.length)];
    // Buscamos los meta_description en articles (la vista boost no los trae); si no está en los 30,
    // hacemos un fetch puntual.
    var inList=articles.find(function(a){return a.id===pick.article_id;});
    if(inList){
      featured=inList;
    }else{
      var r=await _supa.from('magazine_articles_public').select('id,title,slug,type,cover_image_url,meta_description,author_first_name,author_last_name,published_at').eq('id',pick.article_id).maybeSingle();
      if(r&&r.data) featured=r.data;
    }
  }
  if(!featured) featured=articles[0];

  renderFeatured(featured);

  // Grid excluye el featured.
  var rest=articles.filter(function(a){return a.id!==featured.id;});
  renderGrid(rest);
}

function renderFeatured(a){
  var section=document.getElementById('featured');
  var seccion=TYPE_TO_SECCION[a.type]||'articulos';
  var href='/revista/'+seccion+'/'+encodeURIComponent(a.slug)+'/';
  document.getElementById('featuredLink').setAttribute('href',href);
  document.getElementById('featuredImg').style.backgroundImage=a.cover_image_url?"url('"+a.cover_image_url.replace(/'/g,"\\'")+"')":'';
  document.getElementById('featuredType').textContent=TYPE_LABELS[a.type]||a.type;
  document.getElementById('featuredTitle').textContent=a.title||'';
  document.getElementById('featuredDesc').textContent=a.meta_description||'';
  section.style.display='';
}

function renderGrid(items){
  var grid=document.getElementById('grid');
  if(items.length===0){
    grid.innerHTML='<div style="text-align:center;color:#888;padding:60px 0">No hay más artículos por ahora.</div>';
    return;
  }
  // Primera fila: hasta 2 cards (cols-2). Resto: cols-3 en filas de hasta 3.
  var html='';
  var firstRow=items.slice(0,2);
  if(firstRow.length>0){
    html+='<div class="revista-grid-row cols-2">'+firstRow.map(renderCard).join('')+'</div>';
  }
  var rest=items.slice(2);
  for(var i=0;i<rest.length;i+=3){
    var chunk=rest.slice(i,i+3);
    html+='<div class="revista-grid-row cols-3">'+chunk.map(renderCard).join('')+'</div>';
  }
  grid.innerHTML=html;
}

function renderCard(a){
  var seccion=TYPE_TO_SECCION[a.type]||'articulos';
  var href='/revista/'+seccion+'/'+encodeURIComponent(a.slug)+'/';
  var cover=a.cover_image_url||'';
  return '<a class="revista-card" href="'+href+'">'+
    '<div class="revista-card-img"'+(cover?' style="background-image:url(\''+escHtml(cover).replace(/'/g,'%27')+'\')"':'')+'></div>'+
    '<h3>'+escHtml(a.title||'')+'</h3>'+
  '</a>';
}
</script>
</body>
</html>
