<style>

<main class="gs-page">

    <p class="gs-hint">¿No ves el email? Revisa spam o promociones, o escríbenos a <a href="mailto:info@casacurino.com">info@casacurino.com</a>. <a href="/partners/condiciones/">Condiciones de contratación</a>.</p>
  </div>

<script src="/assets/js/main-footer.js"></script>
<script>
(function () {
  'use strict';
  // purchase (GA4 + Purchase Pixel via GTM), item_id 'sesion-1a1'; mismo
  // event_id que el Purchase por CAPI del webhook.
  var sid = new URLSearchParams(location.search).get('session_id') || '';
  if (!/^cs_[A-Za-z0-9_]+$/.test(sid) || sid.length > 200) return;
  var key = 'curino_partners_purchase_' + sid;
  try { if (sessionStorage.getItem(key)) return; } catch (_e) {}
  fetch('/api/stripe-session?session_id=' + encodeURIComponent(sid), { headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.paid) return;
      var eventId = d.event_id || null;
      try { eventId = eventId || sessionStorage.getItem('curino_partners_event_id'); } catch (_e) {}
      var esSesion = d.purpose === 'sesion', esOne = d.purpose === 'one_to_one';
      var t = document.getElementById('gs-titulo'), x = document.getElementById('gs-texto');
      if (esOne) {
        t.textContent = 'Bienvenido al One-to-one Curino Partners.';
        x.innerHTML = 'Te acabamos de enviar un email con el enlace para <strong>agendar tu primera sesión</strong>, mi WhatsApp directo y la factura.';
      } else if (esSesion) {
        t.textContent = 'Tu sesión con Juan está confirmada.';
        x.innerHTML = 'Te acabamos de enviar un email con el enlace para <strong>reservar el día y la hora</strong>, los recursos iniciales y la factura.';
      }
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ ecommerce: null });
      window.dataLayer.push({ event: 'purchase', event_id: eventId, ecommerce: {
        transaction_id: d.transaction_id, value: d.amount_total, currency: d.currency, num_items: 1,
        items: [{ item_id: esOne ? 'one-to-one' : (esSesion ? 'sesion-1a1' : 'intensivo-partners'), item_name: esOne ? 'One-to-one Curino Partners · 3 meses' : (esSesion ? 'Sesión 1:1 con Juan · 30 min' : 'Intensivo Curino Partners'), price: d.amount_total, quantity: 1 }] } });
      try { sessionStorage.setItem(key, '1'); sessionStorage.removeItem('curino_partners_event_id'); } catch (_e) {}
    }).catch(function () {});
})();
</script>
