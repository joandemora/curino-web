<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesi&oacute;n &mdash; Curino</title>
<link rel="icon" type="image/png" href="/assets/imagenes/favicon-curino.png">
<link rel="apple-touch-icon" href="/assets/imagenes/favicon-curino.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--mid:#888;--light:#c0c0c0;--border:#e5e5e5;--bg:#f8f8f6;--white:#fff;
  --font:'Open Sans',system-ui,sans-serif;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--white);color:var(--black);font-family:var(--font);font-weight:400;line-height:1.6;overflow-x:hidden}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:80px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav-logo{text-decoration:none;display:flex;align-items:center}
.nav-logo img{height:28px;width:auto;display:block}
.nav-right{display:flex;align-items:center;gap:1.8rem}
.nav-links{display:flex;gap:1.8rem;align-items:center}
.nav-links a{font-size:12px;letter-spacing:0.24px;text-transform:uppercase;color:#000;text-decoration:none;font-weight:400;transition:color .2s;position:relative}
.nav-links a:hover{color:#999}
.nav-icons{display:flex;gap:1.2rem;align-items:center}
.nav-icons a{font-size:12px;letter-spacing:0.24px;text-transform:uppercase;color:#000;text-decoration:none;font-weight:400;transition:color .2s}
.nav-icons a:hover{color:#999}
.nav-icons svg{width:16px;height:16px;stroke:#000;stroke-width:1.5;fill:none;cursor:pointer;transition:stroke .2s}
.nav-icons svg:hover{stroke:#999}
.nav-mobile-right{display:none}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:.3rem}
.nav-hamburger span{display:block;width:22px;height:1px;background:var(--black);transition:all .3s;transform-origin:center}
.nav-hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* Megamenu */
.mega-trigger{position:relative}
.mega-trigger::after{content:'';position:absolute;left:0;right:0;top:100%;height:80px;display:none}
.mega-trigger:hover::after{display:block}
.mega-trigger:hover .megamenu,.megamenu:hover{opacity:1;visibility:visible;transform:translateY(0)}
.megamenu{position:fixed;top:80px;left:0;right:0;z-index:99;width:100%;background:var(--white);padding:32px;display:flex;justify-content:flex-start;gap:180px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s .1s,visibility .25s .1s,transform .25s .1s;border-top:1px solid var(--border)}
.mega-col{margin-bottom:32px}
.mega-col-title{font-size:12px;letter-spacing:0.24px;text-transform:uppercase;color:#000;font-weight:600;margin-bottom:1rem}
.mega-col a{display:block;font-size:14px;letter-spacing:0.14px;line-height:19.88px;color:#000;text-decoration:none;font-weight:400;text-transform:none;margin-bottom:4px;transition:color .2s}
.mega-col a:hover{color:#999}
.mega-imgs{margin-left:auto;display:flex;gap:16px;flex-shrink:0}
.mega-img{display:flex;flex-direction:column;align-items:center;flex-shrink:0;position:relative}
.mega-img::before{content:'';position:absolute;top:0;left:0;width:300px;height:300px;background:rgba(0,0,0,0);transition:background .3s;z-index:1;pointer-events:none}
.mega-img:hover::before{background:rgba(0,0,0,.2)}
.mega-img img{width:300px;height:300px;object-fit:cover;display:block}
.mega-img>a:first-child{display:block;line-height:0;border:none;padding:0;margin:0}
.mega-img a{display:inline-block;margin-top:12px;font-size:12px;font-weight:400;letter-spacing:0.24px;text-transform:uppercase;color:#000;text-decoration:none;border-bottom:1px solid #000;padding-bottom:3px;transition:color .2s,border-color .2s}
.mega-img a:hover{color:#999;border-color:#999}

/* Mobile menu */
.mobile-menu{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:var(--white);padding:1.5rem 2rem;z-index:99;flex-direction:column;gap:0;overflow-y:auto}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#000;text-decoration:none;font-weight:400;padding:.8rem 0;border-bottom:1px solid var(--border)}
.mobile-menu a:last-child{border-bottom:none}
.mobile-accordion{border-bottom:1px solid var(--border)}
.mobile-accordion-title{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;cursor:pointer;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#000;font-weight:400}
.mobile-accordion-title::after{content:'+';font-size:18px;font-weight:300}
.mobile-accordion.open .mobile-accordion-title::after{content:'\2212'}
.mobile-accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.mobile-accordion.open .mobile-accordion-body{max-height:800px}
.mobile-accordion-body .mobile-sub-title{font-size:12px;letter-spacing:0.24px;text-transform:uppercase;color:#000;font-weight:600;padding:.6rem 0 .3rem}
.mobile-accordion-body a{display:block;font-size:14px;color:#000;text-decoration:none;font-weight:400;text-transform:none;letter-spacing:0.14px;line-height:19.88px;padding:.4rem 0 .4rem 12px;border-bottom:none!important}

/* User/cart icons */
.user-icon-link{display:flex;align-items:center}
.user-icon-link svg{width:16px;height:16px;stroke:#000;stroke-width:1.5;fill:none;cursor:pointer}
.cart-icon{position:relative;cursor:pointer;display:flex;align-items:center}
.cart-icon svg{width:16px;height:16px;stroke:#000;stroke-width:1.5;fill:none}
.cart-badge{position:absolute;top:-6px;right:-8px;background:#0a0a0a;color:#fff;
  font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;
  display:none;align-items:center;justify-content:center;line-height:1}
.cart-badge.visible{display:flex}

/* ── AUTH ── */
.login-wrap{max-width:380px;margin:120px auto 4rem;padding:0 16px}
.auth-tabs{display:flex;align-items:center;margin-bottom:2rem}
.auth-tab{background:none;border:none;font-family:var(--font);font-size:13px;letter-spacing:.03em;color:var(--mid);cursor:pointer;padding:0 0 4px;transition:color .2s}
.auth-tab.active{color:var(--black);font-weight:600;border-bottom:1.5px solid var(--black)}
.auth-tab:hover{color:var(--black)}
.auth-tab-sep{margin:0 .75rem;color:var(--border);font-size:13px;user-select:none}
.auth-panel{display:none}
.auth-panel.active{display:block}
.auth-input{width:100%;padding:.7rem .75rem;font-family:var(--font);font-size:14px;border:1px solid var(--border);outline:none;background:var(--white);transition:border-color .2s;margin-bottom:.75rem}
.auth-input:focus{border-color:var(--black)}
.auth-input::placeholder{color:var(--mid)}
.auth-btn{width:100%;padding:1rem;font-family:var(--font);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:none;cursor:pointer;transition:background .2s;font-weight:400}
.auth-btn-primary{background:var(--black);color:var(--white)}
.auth-btn-primary:hover{background:#333}
.auth-btn-primary:disabled{background:var(--mid);cursor:not-allowed}
.auth-btn-social{background:var(--white);color:var(--black);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.75rem}
.auth-btn-social:hover{border-color:var(--black)}
.auth-btn-social svg{width:16px;height:16px;flex-shrink:0}
.auth-forgot{display:block;text-align:right;font-size:12px;color:var(--mid);text-decoration:none;margin:-0.25rem 0 1rem;transition:color .2s}
.auth-forgot:hover{color:var(--black)}
.auth-divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--mid);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-error{background:#fef2f2;color:#dc2626;padding:.75rem;font-size:13px;margin-bottom:1rem;display:none}
.auth-title{font-size:20px;font-weight:600;margin-bottom:.5rem;letter-spacing:-.01em;color:var(--black)}
.auth-subtitle{font-size:13px;color:var(--mid);margin-bottom:1.5rem;line-height:1.5}
.auth-subtitle strong{color:var(--black);font-weight:600}
.auth-input-otp{font-size:18px;letter-spacing:.4em;text-align:center;font-family:'Open Sans',monospace;font-weight:600}
.auth-actions{display:flex;gap:.5rem;justify-content:center;align-items:center;margin-top:1.25rem;font-size:12px;color:var(--mid)}
.auth-actions-sep{color:var(--border)}
.auth-link{color:var(--mid);text-decoration:underline;cursor:pointer;transition:color .2s;background:none;border:none;font-family:inherit;font-size:inherit;padding:0}
.auth-link:hover{color:var(--black)}
.auth-link.disabled{pointer-events:none;opacity:.5;text-decoration:none}

/* ── FOOTER ── */

/* ── RESPONSIVE ── */
@media(max-width:1200px){
  nav{padding:0 16px;height:60px}
  .nav-logo img{height:20px}
  .nav-right{display:none}
  .nav-mobile-right{display:flex;align-items:center;gap:1rem}
  .nav-mobile-right .nav-hamburger{display:flex}
  .login-wrap{margin-top:80px}
  footer{display:flex!important;flex-direction:column;gap:0;padding:2rem 16px 1.5rem}
  footer>div,footer>.footer-col{grid-area:auto!important;width:100%}
  footer img[alt="Curino"]{height:20px!important}
  .footer-tagline{width:100%;max-width:none}
  .footer-col h4{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:.8rem 0;margin-bottom:0;border-bottom:1px solid rgba(255,255,255,.1)}
  .footer-col h4::after{content:'+';font-size:18px;font-weight:300}
  .footer-col.open h4::after{content:'\2212'}
  .footer-col .footer-links{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .footer-col.open .footer-links{max-height:300px}
  .footer-col a{padding:.4rem 0}
  .footer-newsletter h4::after{display:none}
  .footer-newsletter .footer-links{max-height:none}
  .footer-bottom{flex-direction:column;gap:.5rem;padding:1.2rem 16px}
  .footer-legal{align-items:center;text-align:center}
}
</style>
</head>
<body>

<!-- NAV (inyectado por /assets/js/main-nav.js) -->
<div id="main-nav-mount"></div>
<script src="/assets/js/main-nav.js"></script>

<!-- LOGIN — OTP-only flow (link + código) + Google OAuth -->
<div class="login-wrap">
  <!-- Paso 1: introducir email -->
  <div id="authPanelEmail">
    <h1 class="auth-title">Inicia sesi&oacute;n o crea tu cuenta</h1>
    <p class="auth-subtitle">Te enviaremos un c&oacute;digo por email.</p>
    <div class="auth-error" id="authError"></div>
    <form id="emailForm" onsubmit="handleEmailSubmit(event)">
      <input type="email" class="auth-input" placeholder="Email" id="authEmail" required autocomplete="email">
      <button type="submit" class="auth-btn auth-btn-primary" id="btnEmail">Continuar</button>
    </form>
    <div class="auth-divider">o</div>
    <button class="auth-btn auth-btn-social" onclick="loginWithGoogle()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuar con Google
    </button>
  </div>

  <!-- Paso 2: introducir código -->
  <div id="authPanelOtp" style="display:none">
    <h1 class="auth-title">Revisa tu email</h1>
    <p class="auth-subtitle">Hemos enviado un c&oacute;digo a <strong id="otpEmailDisplay"></strong>. Tambi&eacute;n puedes hacer click en el enlace del email.</p>
    <div class="auth-error" id="authErrorOtp"></div>
    <form id="otpForm" onsubmit="handleOtpSubmit(event)">
      <input type="text" class="auth-input auth-input-otp" placeholder="000000" id="authOtp" required inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button type="submit" class="auth-btn auth-btn-primary" id="btnVerify">Verificar</button>
    </form>
    <div class="auth-actions">
      <button type="button" class="auth-link" id="btnResend" onclick="handleResend()">Reenviar c&oacute;digo</button>
      <span class="auth-actions-sep">&middot;</span>
      <button type="button" class="auth-link" onclick="backToEmail()">Usar otro email</button>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="main-footer-mount"></div>
<script src="/assets/js/main-footer.js"></script>
<script>
/* Mobile menu: lógica vive en /assets/js/main-nav.js */

var supabase;
var _redirect=new URLSearchParams(window.location.search).get('redirect')||'/mi-cuenta/';
var _otpEmail='';
var _resendCooldownTimer=null;

(async function(){
  try{
    var r=await fetch('/api/config',{redirect:'follow'});
    var c=await r.json();
    supabase=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);
    var s=await supabase.auth.getSession();
    if(s.data.session){
      document.getElementById('userIconLink').href='/mi-cuenta/';
      var mob=document.getElementById('userIconLinkMob');if(mob) mob.href='/mi-cuenta/';
      window.location.href=_redirect;
    }
  }catch(e){console.error('Failed to init Supabase:',e);}
})();

function showError(panel,msg){
  var errId=panel==='email'?'authError':'authErrorOtp';
  var el=document.getElementById(errId);
  el.textContent=msg;
  el.style.background='';el.style.color='';
  el.style.display='block';
}
function showSuccess(panel,msg){
  var errId=panel==='email'?'authError':'authErrorOtp';
  var el=document.getElementById(errId);
  el.textContent=msg;
  el.style.background='#f0fdf4';el.style.color='#16a34a';
  el.style.display='block';
}
function clearErrors(){
  document.getElementById('authError').style.display='none';
  document.getElementById('authErrorOtp').style.display='none';
}
function mapAuthError(msg){
  msg=String(msg||'').toLowerCase();
  if(msg.indexOf('rate limit')>=0) return 'Has solicitado demasiados c\u00F3digos. Espera unos minutos.';
  if(msg.indexOf('expired')>=0) return 'El c\u00F3digo ha expirado. Reenv\u00EDa uno nuevo.';
  if(msg.indexOf('invalid')>=0||msg.indexOf('token')>=0) return 'C\u00F3digo incorrecto. Int\u00E9ntalo de nuevo.';
  return 'Algo ha ido mal. Int\u00E9ntalo de nuevo.';
}

async function handleEmailSubmit(e){
  e.preventDefault();
  clearErrors();
  var btn=document.getElementById('btnEmail');
  var email=document.getElementById('authEmail').value.trim().toLowerCase();
  if(!email) return;
  btn.disabled=true;btn.textContent='Enviando\u2026';
  try{
    var result=await supabase.auth.signInWithOtp({
      email:email,
      options:{
        shouldCreateUser:true,
        emailRedirectTo:window.location.origin+_redirect
      }
    });
    if(result.error) throw result.error;
    _otpEmail=email;
    showOtpStep(email);
  }catch(err){
    showError('email',mapAuthError(err.message));
    btn.disabled=false;btn.textContent='Continuar';
  }
}

function showOtpStep(email){
  document.getElementById('authPanelEmail').style.display='none';
  document.getElementById('authPanelOtp').style.display='block';
  document.getElementById('otpEmailDisplay').textContent=email;
  setTimeout(function(){document.getElementById('authOtp').focus();},100);
  startResendCooldown(30);
}

async function handleOtpSubmit(e){
  e.preventDefault();
  clearErrors();
  var btn=document.getElementById('btnVerify');
  var code=document.getElementById('authOtp').value.trim();
  if(!code) return;
  btn.disabled=true;btn.textContent='Verificando\u2026';
  try{
    var result=await supabase.auth.verifyOtp({email:_otpEmail,token:code,type:'email'});
    if(result.error) throw result.error;
    window.location.href=_redirect;
  }catch(err){
    showError('otp',mapAuthError(err.message));
    btn.disabled=false;btn.textContent='Verificar';
  }
}

async function handleResend(){
  if(!_otpEmail) return;
  var link=document.getElementById('btnResend');
  if(link.classList.contains('disabled')) return;
  clearErrors();
  try{
    var result=await supabase.auth.signInWithOtp({
      email:_otpEmail,
      options:{
        shouldCreateUser:true,
        emailRedirectTo:window.location.origin+_redirect
      }
    });
    if(result.error) throw result.error;
    showSuccess('otp','C\u00F3digo reenviado.');
    setTimeout(function(){clearErrors();},3000);
    startResendCooldown(30);
  }catch(err){
    showError('otp',mapAuthError(err.message));
  }
}

function backToEmail(){
  clearErrors();
  _otpEmail='';
  document.getElementById('authOtp').value='';
  var btn=document.getElementById('btnVerify');
  btn.disabled=false;btn.textContent='Verificar';
  document.getElementById('authPanelOtp').style.display='none';
  document.getElementById('authPanelEmail').style.display='block';
  if(_resendCooldownTimer){clearInterval(_resendCooldownTimer);_resendCooldownTimer=null;}
}

function startResendCooldown(seconds){
  var link=document.getElementById('btnResend');
  link.classList.add('disabled');
  var s=seconds;
  link.textContent='Reenviar c\u00F3digo ('+s+'s)';
  if(_resendCooldownTimer) clearInterval(_resendCooldownTimer);
  _resendCooldownTimer=setInterval(function(){
    s-=1;
    if(s<=0){
      clearInterval(_resendCooldownTimer);_resendCooldownTimer=null;
      link.classList.remove('disabled');
      link.textContent='Reenviar c\u00F3digo';
    }else{
      link.textContent='Reenviar c\u00F3digo ('+s+'s)';
    }
  },1000);
}

function getCallbackUrl(){
  return window.location.origin+'/api/auth/callback?redirect='+encodeURIComponent(_redirect);
}

async function loginWithGoogle(){
  if(!supabase) return;
  await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:getCallbackUrl()}});
}
</script>

</body>
</html>
